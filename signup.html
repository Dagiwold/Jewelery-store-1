<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up </title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: url(signup.jpg) no-repeat;
      background-size: cover;
      background-position: center;
    }
    .wrapper {
      width: 420px;
      background: transparent;
      border: 2px solid rgba(255, 255, 255, .2);
      backdrop-filter: blur(9px);
      color: #fff;
      border-radius: 12px;
      padding: 30px 40px;
    }
    .wrapper h1 {
      font-size: 36px;
      text-align: center;
    }
    .wrapper .input-box {
      margin: 20px 0;
      position: relative;
    }
    .input-box input[type="text"],
    .input-box input[type="email"],
    .input-box input[type="password"],
    .input-box input[type="tel"] {
      width: calc(100% - 10px); 
      height: 50px;
      background: transparent;
      border: none;
      outline: none;
      border: 2px solid rgba(255, 255, 255, .2);
      border-radius: 40px;
      font-size: 16px;
      color: #fff;
      padding: 0 20px;
    }
    .input-box select {
      width: 80px; 
      height: 50px;
      background: #000; 
      border: none;
      outline: none;
      border: 2px solid rgba(255, 255, 255, .2);
      border-radius: 40px;
      font-size: 16px;
      color: #fff;
      padding: 0 10px;
      position: absolute;
      top: 0;
      left: calc(100% - 90px); 
    }
    .input-box input::placeholder {
      color: #fff;
    }
    .input-box label {
      display: block;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .input-box input[type="radio"] {
      display: inline-block;
      width: auto;
      margin-right: 10px;
      transform: scale(1.2); 
    }
    .input-box i {
      position: absolute;
      right: 20px;
      top: 30%;
      transform: translate(-50%);
      font-size: 20px;
    }
    .wrapper .btn {
      width: 100%;
      height: 45px;
      background: #fff;
      border: none;
      outline: none;
      border-radius: 40px;
      box-shadow: 0 0 10px rgba(0, 0, 0, .1);
      cursor: pointer;
      font-size: 16px;
      color: #333;
      font-weight: 600;
      margin-top: 20px;
    }
    .wrapper .register-link {
      font-size: 14.5px;
      text-align: center;
      margin-top: 15px;
    }
    .register-link p a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .register-link p a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<link rel="icon"href="logo2.jpg">
<body>
  <div class="wrapper">
    <form onsubmit="event.preventDefault(); signup();">
      <h1>Sign Up</h1>
      <div class="input-box">
        <input type="text" id="fullname" name="fullname" placeholder="Full Name" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input type="text" id="username" name="username" placeholder="Username" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input type="email" id="email" name="email" placeholder="E-mail" required>
        <i class='bx bxs-envelope'></i>
      </div>
      <div class="input-box">
        <input type="password" id="password" name="password" placeholder="Password" required>
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="input-box">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="input-box">
        <label>
          <input type="radio" name="gender" value="male" required> Male
        </label>
        <label>
          <input type="radio" name="gender" value="female" required> Female
        </label>
        <label>
          <input type="radio" name="gender" value="other" required> Other
        </label>
      </div>
      <div class="input-box">
        <select id="countryCode" name="countryCode">
          <option value="+251">+251</option>
          <option value="+254">+254</option>
          <option value="+1">+1</option>
          <option value="+257">+257</option>
        </select>
        <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
        <i class='bx bxs-phone'></i>
      </div>
      <button type="submit" class="btn">Sign Up</button>
      <div class="register-link">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
    </form>
  </div>
  <script>
    function signup() {
        var fullName = document.getElementById('fullname').value;
        var username = document.getElementById('username').value;
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        var gender = document.querySelector('input[name="gender"]:checked').value;
        var phone = document.getElementById('countryCode').value + document.getElementById('phone').value;

        if (fullName === '' || username === '' || email === '' || password === '' || confirmPassword === '' || gender === null || phone === '') {
            alert("Please fill in all fields.");
            return;
        }

        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }
    
        alert("Sign up successful! Welcome, " + fullName + "!");
        window.location.href = "home.html";
    }
  </script>
</body>
</html>
